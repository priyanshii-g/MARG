spring:
  application:
    name: marg-routing-prototype
  ai:
    mcp:
      server:
        protocol: STATELESS
        type: SYNC
        annotation-scanner:
          enabled: true
  servlet:
    multipart:
      max-file-size: 51MB
      max-request-size: 51MB
  mongodb:
    uri: ${MARG_MONGODB_URI:mongodb://localhost:27017/marg?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.pdfbox.pdmodel.font: ERROR

marg:
  study-region: kaziranga-karbi-anglong
  eia:
    template-path: ${MARG_EIA_TEMPLATE_PATH:data/templates/mode1-environmental-eia-section-template.docx}
    output-directory: ${MARG_EIA_OUTPUT_DIRECTORY:data/generated-reports}
    knowledge-directory: ${MARG_EIA_KNOWLEDGE_DIRECTORY:${user.dir}/..}
    auto-index: ${MARG_EIA_AUTO_INDEX:false}
    retrieval-limit: ${MARG_EIA_RETRIEVAL_LIMIT:8}
    chunk-size: ${MARG_EIA_CHUNK_SIZE:1200}
    chunk-overlap: ${MARG_EIA_CHUNK_OVERLAP:200}
    minimum-pdf-pages: ${MARG_EIA_MINIMUM_PDF_PAGES:8}
    libreoffice-binary: ${MARG_LIBREOFFICE_BIN:/Applications/LibreOffice.app/Contents/MacOS/soffice}
    llm:
      enabled: ${MARG_EIA_LLM_ENABLED:false}
      base-url: ${MARG_EIA_LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      api-key: ${MARG_EIA_LLM_API_KEY:}
      model: ${MARG_EIA_LLM_MODEL:gemini-2.5-flash}
      timeout-seconds: ${MARG_EIA_LLM_TIMEOUT_SECONDS:90}
      fallback-models: ${MARG_EIA_LLM_FALLBACK_MODELS:gemini-2.0-flash,gemini-1.5-flash,gemini-2.5-pro}
      retry-delay-millis: ${MARG_EIA_LLM_RETRY_DELAY_MILLIS:500}
  mode2:
    projects-directory: ${MARG_MODE2_PROJECTS_DIRECTORY:data/mode2/projects}
  mcp:
    bearer-token: ${MARG_MCP_BEARER_TOKEN:}
  routing:
    corridor-buffer-deg: 0.15
    # Internal routing grid. Coordinates are projected to UTM 46N before search.
    resolution-meters: 250
    utm-zone: 46
    lulc:
      # Dimensionless additive movement-cost contributions.
      # 0 = no extra cost; values are MARG model parameters, not official land-use values.
      penalties:
        BUILT_UP: 1.5
        FOREST: 0.8
        WETLAND_WATER: 2.0
        AGRICULTURE: 0.25
        GRASS_GRAZING: 0.10
        BARREN_WASTELAND: 0.0
        SNOW: 2.5
        UNKNOWN: 1.0
    slope:
      free-max-degrees: 5.0
      low-max-degrees: 10.0
      moderate-max-degrees: 15.0
      steep-max-degrees: 25.0
      very-steep-max-degrees: 30.0

      low-penalty: 0.15
      moderate-penalty: 0.40
      steep-penalty: 1.00
      very-steep-penalty: 2.00

      block-no-data: true
      block-above-very-steep: true

    flood:
      penalties:
        VERY_LOW: 0.0
        LOW: 0.20
        MODERATE: 0.60
        HIGH: 1.50
        VERY_HIGH: 3.00
        NOT_IN_HAZARD_LAYER: 0.0
        UNKNOWN: 2.00

    settlement:
      block-urban-core: false
      block-no-data: false
      penalties:
        NONE: 0.0
        OUTER_BUFFER: 0.30
        INNER_BUFFER: 0.80
        RURAL_CORE: 1.60
        URBAN_CORE: 2.50
        NODATA: 0.0

    transport:
      default-facility-mode: NATIONAL_HIGHWAY
      block-no-data: false
      skew-angle-penalty-factor: 1.25
      parallel-acute-penalty: 2.00
      parallel-proximity-radius-meters: 150.0
      expressway-accessibility-pull: 0.0
      expressway-min-interchange-spacing-km: 15.0
      expressway-min-hub-population: 40000
      expressway-design-capacity-pcu-hr: 4800.0
      expressway-base-through-traffic-pcu-hr: 1400.0
      national-highway-accessibility-pull: 0.35
      national-highway-min-interchange-spacing-km: 8.0
      national-highway-min-hub-population: 22000
      national-highway-design-capacity-pcu-hr: 3600.0
      national-highway-base-through-traffic-pcu-hr: 1350.0
      max-vc-ratio: 0.75
      peak-trip-generation-pcu-per-1000-pop: 9.5
      collector-sweet-spot-min-km: 1.5
      collector-sweet-spot-max-km: 5.0
      collector-longitudinal-band-km: 10.0
      node-penalties:
        NONE: 0.0
        ROAD_PARALLEL_BUFFER: 0.40
        MDR_CORRIDOR: 1.10
        SH_CORRIDOR: 1.60
        NH_CORRIDOR: 2.20
        RAILWAY_BUFFER: 0.90
        RAILWAY_CORRIDOR: 3.50
        NODATA: 0.0
      crossing-base-cost-km-eq:
        RAILWAY: 2.40
        NATIONAL_HIGHWAY: 1.50
        STATE_HIGHWAY: 0.95
        MAJOR_DISTRICT_ROAD: 0.55

    hydrology:
      block-wetlands: false
      block-no-data: false
      hydraulic-skew-penalty-factor: 1.40
      parallel-bank-penalty: 2.40
      parallel-bank-radius-meters: 180.0
      node-penalties:
        NONE: 0.0
        RIPARIAN_OUTER_BUFFER: 0.35
        RIPARIAN_INNER_BUFFER: 0.95
        MINOR_PERENNIAL_STREAM: 1.60
        MEDIUM_PERENNIAL_RIVER: 2.60
        INLAND_WETLAND_WATERBODY: 3.40
        MAJOR_PERENNIAL_RIVER: 4.00
        NODATA: 0.0
      bridge-base-cost-km-eq:
        MAJOR_PERENNIAL_RIVER: 2.80
        MEDIUM_PERENNIAL_RIVER: 1.45
        MINOR_PERENNIAL_STREAM: 0.65

    wildlife:
      block-critical-corridors: false
      block-no-data: false
      barrier-skew-penalty-factor: 1.45
      parallel-corridor-penalty: 2.60
      parallel-corridor-radius-meters: 280.0
      node-penalties:
        NONE: 0.0
        ESZ_OUTER_TRANSITION_ZONE: 0.35
        WILDLIFE_CORRIDOR_FRINGE_BUFFER: 0.75
        ESZ_INNER_BUFFER_ZONE: 1.15
        REGIONAL_FOREST_STEPPING_CORRIDOR: 1.65
        CRITICAL_MIGRATION_CORRIDOR_CORE: 2.90
        PROTECTED_SANCTUARY_HABITAT: 5.00
        NODATA: 0.0
      passage-base-cost-km-eq:
        CRITICAL_ELEPHANT_RHINO_CORRIDOR: 3.10
        INTER_SANCTUARY_ELEPHANT_CORRIDOR: 1.85
        LOCAL_WILDLIFE_DISPERSAL_AXIS: 0.95

    geotech:
      block-active-landslide-zones: false
      block-no-data: false
      scarp-skew-penalty-factor: 1.40
      parallel-scarp-undercut-penalty: 2.50
      parallel-scarp-radius-meters: 260.0
      node-penalties:
        COMPETENT_BEDROCK_STABLE_SUBGRADE: 0.0
        WEATHERED_RESIDUAL_MODERATE_SOIL: 0.25
        SOFT_ALLUVIAL_COMPRESSIBLE_CLAY: 0.85
        MODERATE_COLLUVIAL_LANDSLIDE_SUSCEPTIBILITY: 1.20
        LIQUEFIABLE_ORGANIC_MARSH_SUBGRADE: 2.10
        HIGH_LANDSLIDE_SUSCEPTIBILITY_SCARP: 2.65
        ACTIVE_TECTONIC_LANDSLIDE_SHEAR_CORE: 4.20
        NODATA: 0.0
      mitigation-base-cost-km-eq:
        ACTIVE_FAULT_SHEAR_ZONE: 2.60
        UNSTABLE_COLLUVIAL_LANDSLIDE_SCARP: 1.70
        LIQUEFIABLE_ALLUVIAL_FAULT_TROUGH: 1.15

    utility:
      block-substations-and-towers: false
      block-no-data: false
      crossing-skew-penalty-factor: 1.40
      parallel-utility-row-penalty: 2.50
      parallel-utility-radius-meters: 100.0
      tower-proximity-threshold-meters: 50.0
      tower-proximity-surcharge-factor: 0.50
      node-penalties:
        NONE: 0.0
        UTILITY_PROXIMITY_SETBACK_ZONE: 0.15
        DISTRIBUTION_LINE_ROW: 0.50
        SUBTRANSMISSION_132KV_ROW: 1.10
        EHV_220KV_ROW: 1.90
        EHV_400KV_ROW: 2.80
        SUBSTATION_OR_TOWER_FOOTPRINT: 4.50
        NODATA: 0.0
      crossing-protection-base-cost-km-eq:
        EHV_400KV_TRANSMISSION: 2.80
        EHV_220KV_TRANSMISSION: 2.00
        SUBTRANSMISSION_132KV: 1.30
        DISTRIBUTION_66KV_AND_BELOW: 0.75

    row:
      expressway-row-width-meters: 60.0
      national-highway-row-width-meters: 45.0
      feeder-spur-row-width-meters: 30.0
      interchange-footprint-radius-meters: 150.0
      construction-zone-half-width-meters: 100.0
      environmental-buffer-half-width-meters: 250.0
      cross-section-sample-step-meters: 125.0
      geo-json-simplify-tolerance-meters: 8.0

    building:
      block-institutional-and-religious-compounds: false
      block-high-density-built-up: false
      block-no-data: false
      row-evaluation-half-width-meters: 30.0
      structure-proximity-buffer-meters: 60.0
      proximity-surcharge-factor: 0.35
      node-penalties:
        NONE: 0.0
        SPARSE_HOMESTEAD_FRINGE: 0.25
        LOW_DENSITY_RURAL_RIBBON: 0.70
        MEDIUM_DENSITY_VILLAGE_CLUSTER: 1.55
        HIGH_DENSITY_COMMERCIAL_URBAN_BUILTUP: 2.85
        INSTITUTIONAL_RELIGIOUS_COMPOUND_FOOTPRINT: 4.40
        NODATA: 0.0
      structure-demolition-cost-km-eq:
        RESIDENTIAL: 0.28
        COMMERCIAL: 0.42
        INSTITUTIONAL: 0.85
        RELIGIOUS: 0.95
        INDUSTRIAL: 0.55
        VILLAGE_INFRASTRUCTURE: 0.35
      settlement-severance-penalty:
        RURAL: 0.45
        URBAN: 1.15
        INDUSTRIAL: 0.80

    demographic:
      block-very-high-urban-density-core: false
      block-high-density-population-clusters: false
      block-no-data: false
      row-evaluation-half-width-meters: 30.0
      primary-demographic-buffer-meters: 250.0
      secondary-demographic-buffer-meters: 500.0
      direct-row-penalty-per1000-pop-km-eq: 0.65
      primary-buffer-penalty-per1000-pop-km-eq: 0.28
      secondary-buffer-penalty-per1000-pop-km-eq: 0.10
      node-penalties:
        UNINHABITED_OR_BACKGROUND: 0.0
        SPARSE_RURAL_DISPERSED: 0.15
        LOW_DENSITY_VILLAGE: 0.45
        MODERATE_DENSITY_SETTLEMENT: 1.20
        HIGH_DENSITY_POPULATION_CLUSTER: 2.65
        VERY_HIGH_URBAN_DENSITY_CORE: 4.20
        NODATA: 0.0
      vulnerability-multipliers:
        LOW_VULNERABILITY: 1.00
        MODERATE_VULNERABILITY: 1.25
        HIGH_VULNERABILITY_SIXTH_SCHEDULE_RURAL: 1.55
        CRITICAL_VULNERABILITY_TRIBAL_LIVELIHOOD_CLUSTER: 1.90

    drainage:
      block-protected-wetland-core: false
      block-all-wetland-core: false
      block-no-data: false
      row-evaluation-half-width-meters: 30.0
      wetland-direct-row-step-penalty-km-eq: 1.95
      wetland-100m-buffer-step-penalty-km-eq: 0.75
      wetland-250m-buffer-step-penalty-km-eq: 0.25
      parallel-thalweg-step-penalty-km-eq: 1.65
      watershed-divide-crossing-penalty-km-eq: 0.18
      skew-crossing-penalty-factor: 0.45
      node-penalties:
        WELL_DRAINED_UPLAND_OR_NONE: 0.0
        WATERSHED_VALLEY_DRAINAGE_SWALE: 0.18
        LOCAL_WATERCOURSE_AND_SHEET_FLOW_ZONE: 0.60
        SEASONAL_STREAM_AND_TORRENT_CORRIDOR: 1.15
        IRRIGATION_CANAL_COMMAND_ROW: 1.55
        SEASONAL_MARSH_AND_WETLAND_BUFFER: 1.65
        NATURAL_OR_DESIGNATED_WETLAND_CORE: 3.85
        NODATA: 0.0
      crossing-base-costs-km-eq:
        WETLAND: 2.40
        SEASONAL_STREAM: 1.35
        NATURAL_DRAINAGE_CHANNEL: 0.95
        IRRIGATION_CANAL: 1.65
        LOCAL_WATERCOURSE: 0.55
        WATERSHED: 0.25

  terrain:
    slope-path: data/processed/dem/assam_slope_utm46.tif

  protected-area:
    raster-path: data/processed/protected-areas/assam_protected_area_mask_utm46.tif

  settlement:
    raster-path: data/processed/settlements/assam_settlement_exposure_utm46.tif

  transport:
    raster-path: data/processed/transport/assam_transport_network_utm46.tif
    network-geojson-path: data/processed/transport/assam_transport_network.geojson
    hubs-geojson-path: data/processed/transport/assam_regional_hubs.geojson

  hydrology:
    raster-path: data/processed/hydrology/assam_water_bodies_utm46.tif
    rivers-geojson-path: data/processed/hydrology/assam_perennial_rivers.geojson
    wetlands-geojson-path: data/processed/hydrology/assam_wetlands_catalog.geojson

  wildlife:
    raster-path: data/processed/wildlife/assam_wildlife_esz_corridors_utm46.tif
    corridors-geojson-path: data/processed/wildlife/assam_wildlife_corridors.geojson

  geotech:
    raster-path: data/processed/geotech/assam_geotech_landslide_utm46.tif
    lineaments-geojson-path: data/processed/geotech/assam_fault_landslide_zones.geojson

  utility:
    raster-path: data/processed/utilities/assam_utility_corridors_utm46.tif
    lines-geojson-path: data/processed/utilities/assam_power_transmission_lines.geojson
    assets-geojson-path: data/processed/utilities/assam_utility_assets.geojson

  building:
    raster-path: data/processed/buildings/assam_building_density_utm46.tif
    settlements-geojson-path: data/processed/buildings/assam_settlement_boundaries.geojson
    footprints-geojson-path: data/processed/buildings/assam_building_footprints.geojson

  demographic:
    raster-path: data/processed/demographics/assam_population_density_utm46.tif
    tracts-geojson-path: data/processed/demographics/assam_population_demographics.geojson

  drainage:
    raster-path: data/processed/drainage/assam_drainage_wetland_utm46.tif
    wetlands-geojson-path: data/processed/drainage/assam_wetlands_polygons.geojson
    network-geojson-path: data/processed/drainage/assam_drainage_network.geojson
    watersheds-geojson-path: data/processed/drainage/assam_watershed_basins.geojson
  bhuvan:
    lulc:
      sample-resolution-deg: 0.01
      query-half-size-deg: 0.004
      parallelism: 6
      cache-file: data/cache/bhuvan-lulc-samples.json
      max-remote-samples: 20000
    flood-raster:
      cache-directory: data/cache/bhuvan-flood-wms
      tile-pixels: 512
      target-pixels-per-degree: 1000
      color-tolerance: 28
      classification-window-radius: 1
